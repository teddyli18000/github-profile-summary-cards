name: Agent alias regression check

on:
  push:
    branches:
      - agent-ci/exclude-alias-case

jobs:
  translator-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
      - run: npx jest tests/utils/translator.test.ts --runInBand
